<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#B9AD9C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RENW">
<meta name="mobile-web-app-capable" content="yes">
<title>RNW Skin Renewal — Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Firebase (usado apenas se FIREBASE_CONFIG estiver preenchido mais abaixo; se falhar a carregar por falta de rede, a app continua a funcionar 100% offline com armazenamento local) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --wall:#B9AD9C;
  --wall-dark:#a89b88;
  --cream:#EDE7DD;
  --paper:#FBFAF7;
  --ink:#2A2420;
  --ink-soft:#5c5349;
  --bronze:#A9814F;
  --bronze-dark:#8a6a3f;
  --line:#DAD2C4;
  --good:#6B7F5E;
  --good-bg:#eef1ea;
  --bad:#AE5B3F;
  --bad-bg:#f7e9e3;
  --warn:#B08A2E;
  --warn-bg:#f7f0dc;
  --radius:7px;
  --shadow:0 1px 2px rgba(42,36,32,.06);
  --sidebar-w:224px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Manrope',sans-serif;
  background:var(--cream);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.serif{font-family:'Fraunces',serif;}
button{font-family:inherit;}
input,select,textarea{font-family:'Manrope',sans-serif;}
::selection{background:var(--bronze);color:#fff;}
a{color:inherit;}

/* ---------- LOGIN ---------- */
#login-screen{
  min-height:100vh;display:none;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 38%, #d8cfbf 0%, var(--wall) 55%, #a99c88 100%);
  padding:24px;
}
.login-card{
  background:var(--paper);
  border-radius:14px;
  padding:44px 40px 36px;
  width:100%;max-width:380px;
  box-shadow:0 18px 50px rgba(30,24,18,.25);
  text-align:center;
}
.brand-mark{
  font-family:'Fraunces',serif;font-weight:700;font-size:38px;letter-spacing:2px;
  color:var(--ink);margin-bottom:2px;
}
.brand-sub{
  font-size:11px;letter-spacing:4px;color:var(--bronze-dark);margin-bottom:28px;font-weight:600;
}
.role-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:18px;}
.role-btn{
  padding:12px 6px;border-radius:8px;border:1.5px solid var(--line);background:var(--cream);
  cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-soft);transition:.15s;
}
.role-btn.active{border-color:var(--bronze);background:#f3ead9;color:var(--bronze-dark);}
.pin-dots{display:flex;gap:12px;justify-content:center;margin:18px 0 22px;}
.pin-dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line);background:#fff;}
.pin-dot.filled{background:var(--bronze);border-color:var(--bronze);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.keypad button{
  padding:15px 0;border-radius:9px;border:1px solid var(--line);background:#fff;
  font-size:17px;font-weight:600;cursor:pointer;color:var(--ink);
}
.keypad button:active{background:var(--cream);}
.keypad .wide{grid-column:span 1;font-size:13px;color:var(--ink-soft);}
.login-err{color:var(--bad);font-size:12.5px;margin-top:10px;min-height:16px;}
.login-hint{font-size:11px;color:#9a8f80;margin-top:16px;}

/* ---------- APP SHELL ---------- */
#app{display:none;min-height:100vh;}
#app.show{display:flex;}
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--wall);color:var(--ink);
  display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;
}
.side-brand{padding:4px 8px 20px;border-bottom:1px solid rgba(42,36,32,.15);margin-bottom:14px;}
.side-brand .name{font-family:'Fraunces',serif;font-weight:700;font-size:21px;letter-spacing:1px;}
.side-brand .tag{font-size:9.5px;letter-spacing:2.5px;color:var(--ink-soft);font-weight:600;margin-top:2px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;cursor:pointer;
  font-size:13.5px;font-weight:600;color:var(--ink-soft);margin-bottom:2px;transition:.12s;
  user-select:none;
}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.75;}
.nav-item:hover{background:rgba(255,255,255,.35);}
.nav-item.active{background:var(--paper);color:var(--ink);}
.nav-item.active svg{opacity:1;}
.nav-group-label{font-size:10px;letter-spacing:1.5px;color:#7a6f5f;font-weight:700;margin:14px 10px 6px;text-transform:uppercase;}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(42,36,32,.15);}
.side-user{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:12.5px;font-weight:600;}
.side-user .dot{width:7px;height:7px;border-radius:50%;background:var(--good);}
.logout-btn{font-size:11.5px;color:var(--ink-soft);background:none;border:none;cursor:pointer;padding:6px 8px;text-decoration:underline;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;padding:16px 28px;
  border-bottom:1px solid var(--line);background:var(--paper);flex-shrink:0;
}
.topbar h1{font-size:21px;margin:0;font-weight:600;}
.topbar .date-badge{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.cash-badge{
  display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:7px 12px;border-radius:20px;
  cursor:pointer;
}
.cash-badge.open{background:var(--good-bg);color:var(--good);}
.cash-badge.closed{background:var(--bad-bg);color:var(--bad);}
.cash-badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}

.sync-badge{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:6px 11px;border-radius:20px;
  background:var(--cream);color:var(--ink-soft);
}
.sync-badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.sync-badge.online{background:var(--good-bg);color:var(--good);}
.sync-badge.syncing{background:var(--warn-bg);color:var(--warn);}
.sync-badge.offline{background:var(--warn-bg);color:var(--warn);}
.sync-badge.local{background:var(--cream);color:var(--ink-soft);}

#page-content{flex:1;overflow-y:auto;padding:24px 28px 60px;}

/* ---------- GENERIC UI ---------- */
.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
.kpi-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
.kpi-card .label{font-size:11.5px;color:var(--ink-soft);font-weight:600;letter-spacing:.3px;}
.kpi-card .value{font-family:'Fraunces',serif;font-size:26px;font-weight:600;margin-top:4px;}
.kpi-card .sub{font-size:11px;color:var(--ink-soft);margin-top:3px;}

.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.section-head h2{font-size:18px;font-weight:600;margin:0;}
.section-head .actions{display:flex;gap:8px;flex-wrap:wrap;}

.btn{
  border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:7px;
  font-size:12.5px;font-weight:700;cursor:pointer;transition:.12s;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:var(--bronze);}
.btn-primary{background:var(--ink);border-color:var(--ink);color:#fff;}
.btn-primary:hover{background:#403a33;}
.btn-bronze{background:var(--bronze);border-color:var(--bronze);color:#fff;}
.btn-bronze:hover{background:var(--bronze-dark);}
.btn-danger{color:var(--bad);}
.btn-danger:hover{border-color:var(--bad);}
.btn-sm{padding:5px 10px;font-size:11.5px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;font-size:10.5px;letter-spacing:.6px;color:var(--ink-soft);font-weight:700;
  text-transform:uppercase;padding:9px 12px;border-bottom:1.5px solid var(--line);white-space:nowrap;
}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#f5f1ea;}
.table-wrap{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;}
.empty-row td{text-align:center;color:var(--ink-soft);padding:30px;font-size:13px;}

.tag{display:inline-flex;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.tag-good{background:var(--good-bg);color:var(--good);}
.tag-bad{background:var(--bad-bg);color:var(--bad);}
.tag-warn{background:var(--warn-bg);color:var(--warn);}
.tag-neutral{background:var(--cream);color:var(--ink-soft);}

.field{margin-bottom:13px;}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:#fff;color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--bronze);}
.field-row{display:grid;gap:12px;}
.cols-2{grid-template-columns:1fr 1fr;}
.cols-3{grid-template-columns:1fr 1fr 1fr;}

.pill-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.pill-tab{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;background:var(--paper);border:1px solid var(--line);cursor:pointer;color:var(--ink-soft);}
.pill-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}

.search-box{position:relative;flex:1;max-width:280px;}
.search-box input{width:100%;padding:8px 12px 8px 30px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;background:#fff;}
.search-box svg{position:absolute;left:9px;top:9px;width:14px;height:14px;opacity:.5;}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(30,24,18,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
.overlay.show{display:flex;}
.modal{background:var(--paper);border-radius:12px;width:100%;max-width:480px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(20,16,12,.3);}
.modal.wide{max-width:640px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);}
.modal-head h3{margin:0;font-size:16.5px;font-weight:600;}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);line-height:1;}
.modal-body{padding:20px 22px;overflow-y:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}

.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;font-size:12.5px;font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:slideIn .2s ease;}
.toast.bad{background:var(--bad);}
.toast.good{background:var(--good);}
@keyframes slideIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.progress-bar{height:6px;background:var(--cream);border-radius:4px;overflow:hidden;}
.progress-bar > div{height:100%;background:var(--bronze);}

/* POS layout */
.pos-wrap{display:grid;grid-template-columns:1fr 340px;gap:16px;height:100%;}
.pos-catalog{overflow-y:auto;padding-right:4px;}
.pos-cart{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;height:calc(100vh - 130px);position:sticky;top:0;}
.pos-cart-items{flex:1;overflow-y:auto;padding:14px;}
.pos-item-card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;cursor:pointer;
  transition:.12s;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;
}
.pos-item-card:hover{border-color:var(--bronze);}
.pos-item-card .nm{font-weight:700;font-size:13px;}
.pos-item-card .cat{font-size:11px;color:var(--ink-soft);}
.pos-item-card .pr{font-weight:700;font-size:13px;color:var(--bronze-dark);white-space:nowrap;}
.cart-line{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.cart-line:last-child{border-bottom:none;}
.qty-ctrl{display:flex;align-items:center;gap:6px;margin-top:4px;}
.qty-ctrl button{width:20px;height:20px;border-radius:5px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12px;line-height:1;}
.pos-cart-foot{padding:14px 16px;border-top:1px solid var(--line);}
.pos-totals-row{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;color:var(--ink-soft);}
.pos-totals-row.total{font-size:17px;font-weight:700;color:var(--ink);margin-top:6px;}

.print-area{display:none;}
@media print{
  body *{visibility:hidden;}
  .print-area, .print-area *{visibility:visible;}
  .print-area{display:block !important;position:absolute;top:0;left:0;width:100%;padding:20px;}
}

.attn-badge{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block;margin-left:5px;}

@media (max-width:880px){
  :root{--sidebar-w:0px;}
  .sidebar{position:fixed;left:-240px;width:220px;z-index:90;transition:.2s;box-shadow:0 0 30px rgba(0,0,0,.3);}
  .sidebar.open{left:0;}
  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(20,16,12,.4);z-index:85;}
  .sidebar-backdrop.show{display:block;}
  .main{width:100%;}
  #page-content{padding:16px 14px 50px;}
  .topbar{padding:12px 14px;}
  .pos-wrap{grid-template-columns:1fr;}
  .pos-cart{height:auto;position:relative;}
  .field-row.cols-2,.field-row.cols-3{grid-template-columns:1fr;}
  .menu-toggle{display:flex !important;}
  .table-wrap table{font-size:12.5px;}
  .btn-sm{padding:7px 11px;}
}
@media (max-width:480px){
  .field input, .field select, .field textarea{font-size:16px;} /* prevents iOS auto-zoom on focus */
  .login-card{padding:32px 22px 28px;}
  .topbar h1{font-size:17px;}
  .topbar .date-badge{font-size:10.5px;}
  .grid-kpi{grid-template-columns:1fr 1fr;}
  .kpi-card{padding:12px 13px;}
  .kpi-card .value{font-size:20px;}
  .modal{max-width:100%;}
  .modal-body{padding:16px;}
  .section-head{align-items:stretch;}
  .section-head .actions{width:100%;}
  .section-head .actions .btn{flex:1;justify-content:center;}
  .cash-badge, .sync-badge{padding:6px 8px;}
  .cash-badge .label, .sync-badge .label{display:none;}
}
.menu-toggle{display:none;background:none;border:none;cursor:pointer;padding:4px;}
.menu-toggle svg{width:22px;height:22px;}
</style>
</head>
<body>

<!-- ================= CONFIGURAÇÃO INICIAL (primeira utilização) ================= -->
<div id="setup-screen" style="min-height:100vh;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 38%, #d8cfbf 0%, var(--wall) 55%, #a99c88 100%);padding:24px;">
  <div class="login-card" style="max-width:420px;text-align:left;">
    <div style="text-align:center;">
      <img id="setup-logo" style="width:64px;height:64px;border-radius:50%;object-fit:cover;margin-bottom:8px;" alt="RENW">
      <div class="brand-mark" style="font-size:28px;">Configuração inicial</div>
      <div class="brand-sub" style="margin-bottom:22px;">RENW SKIN RENEWAL</div>
    </div>
    <p style="font-size:12.5px;color:var(--ink-soft);margin:-10px 0 16px;">Esta é a primeira vez que a aplicação é aberta neste dispositivo. Preencha os dados reais do salão e crie a conta de Administrador — não há dados de demonstração.</p>
    <div class="field"><label>Nome da empresa</label><input id="s-company" value="RENW Skin Renewal"></div>
    <div class="field-row cols-2">
      <div class="field"><label>Telefone</label><input id="s-phone" placeholder="84 000 0000"></div>
      <div class="field"><label>NUIT</label><input id="s-nuit" placeholder="Opcional"></div>
    </div>
    <div class="field"><label>Morada</label><input id="s-address" placeholder="Ex: Nampula, Moçambique"></div>
    <hr style="border:none;border-top:1px solid var(--line);margin:16px 0;">
    <div class="field"><label>O seu nome (Administrador)</label><input id="s-admin-name" placeholder="Ex: Sérgio Chuni"></div>
    <div class="field"><label>Crie um PIN de acesso (4 dígitos)</label><input id="s-admin-pin" maxlength="4" inputmode="numeric" placeholder="Ex: 7392"></div>
    <div class="login-err" id="setup-err"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px;padding:11px;" onclick="finishSetup()">Criar sistema</button>
  </div>
</div>

<!-- ================= LOGIN ================= -->
<div id="login-screen">
  <div class="login-card">
    <img id="login-logo" style="width:76px;height:76px;border-radius:50%;object-fit:cover;margin-bottom:10px;" alt="RENW">
    <div class="brand-mark">RENW</div>
    <div class="brand-sub">SKIN RENEWAL &nbsp;·&nbsp; GESTÃO</div>
    <div class="role-grid" id="role-grid"></div>
    <div class="pin-dots" id="pin-dots"></div>
    <div class="keypad" id="keypad"></div>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="sidebar" id="sidebar">
    <div class="side-brand" style="display:flex;align-items:center;gap:9px;">
      <img id="side-logo" style="width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;" alt="RENW">
      <div>
        <div class="name" style="font-size:17px;">RENW</div>
        <div class="tag" style="font-size:8.5px;">SKIN RENEWAL</div>
      </div>
    </div>
    <nav id="nav-list"></nav>
    <div class="side-foot">
      <div class="side-user"><span class="dot"></span><span id="side-user-name">—</span></div>
      <button class="logout-btn" onclick="logout()">Terminar sessão</button>
    </div>
  </div>
  <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="menu-toggle" onclick="toggleSidebar()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div>
          <h1 id="page-title">Painel</h1>
          <div class="date-badge" id="today-date"></div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="sync-badge" id="sync-badge"></span>
        <div class="cash-badge" id="cash-badge" onclick="navigate('caixa')"></div>
      </div>
    </div>
    <div id="page-content"></div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal-el"></div></div>
<div class="toast-wrap" id="toast-wrap"></div>
<div class="print-area" id="print-area"></div>

<script>
/* =========================================================================
   RNW SKIN RENEWAL — ERP
   Single-file app. Data persisted in localStorage (offline-first).
   ========================================================================= */

const NAV = [
  {group:'Operação'},
  {id:'dashboard', label:'Painel', icon:'grid'},
  {id:'agenda', label:'Agenda', icon:'cal'},
  {id:'vendas', label:'Vendas / POS', icon:'cart'},
  {id:'caixa', label:'Caixa', icon:'box'},
  {group:'Cadastros'},
  {id:'clientes', label:'Clientes', icon:'user'},
  {id:'servicos', label:'Serviços', icon:'spark'},
  {id:'produtos', label:'Produtos', icon:'tag'},
  {id:'estoque', label:'Estoque', icon:'stack'},
  {id:'fornecedores', label:'Fornecedores', icon:'truck'},
  {id:'profissionais', label:'Profissionais', icon:'users'},
  {group:'Gestão'},
  {id:'relatorios', label:'Relatórios', icon:'chart'},
  {id:'contabilidade', label:'Contabilidade', icon:'coin'},

/* =========================================================================

   Preencha FIREBASE_CONFIG com os dados do seu projeto Firebase
   (Firebase Console → Project settings → Your apps → SDK setup and
   configuration). Enquanto ficar com os valores "SUBSTITUA_AQUI", a app
   funciona apenas com armazenamento local neste dispositivo (offline).
   Depois de preenchido, os dados sincronizam automaticamente entre todos
   os dispositivos que abrirem este mesmo ficheiro, e continuam a
   funcionar offline (o Firestore guarda uma cópia local e sincroniza
   sozinho assim que a ligação à internet voltar).
   ========================================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCmS1zp__xP7-zyVieTC0nbeb8jjORmeOs",
  authDomain: "rnw-skin-renewal.firebaseapp.com",
  projectId: "rnw-skin-renewal",

  messagingSenderId: "937102767906",

};
const FIRESTORE_PATH = {collection:'rnw_erp', doc:'main'};

let fbApp=null, fbDb=null, fbDocRef=null, fbApplyingRemote=false, fbSaveTimer=null;

function firebaseConfigured(){
  return FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf('SUBSTITUA_AQUI')===-1;
}
function updateSyncBadge(state){
  const el = document.getElementById('sync-badge');
  if(!el) return;
  const map = {
    online:   ['online','Sincronizado'],
    syncing:  ['syncing','A sincronizar...'],
    offline:  ['offline','Sem ligação — dados locais'],
    connecting:['syncing','A ligar...'],
    local:    ['local','Modo local (sem sincronização)'],
  };
  const [cls,label] = map[state] || map.local;
  el.className = 'sync-badge '+cls;
  el.innerHTML = `<span class="dot"></span><span class="label">${label}</span>`;
}
function pushToFirebase(){
  if(!fbDocRef) return;
  fbDocRef.set({db: JSON.stringify(DB), updatedAt: firebase.firestore.FieldValue.serverTimestamp()})
    .then(()=>updateSyncBadge('online'))
    .catch(()=>updateSyncBadge('offline'));
}
function scheduleFirebaseSave(){
  if(!fbDocRef || fbApplyingRemote) return;
  updateSyncBadge('syncing');
  clearTimeout(fbSaveTimer);
  fbSaveTimer = setTimeout(pushToFirebase, 500);
}
function listenFirebase(){
  fbDocRef.onSnapshot({includeMetadataChanges:true}, snap=>{
    if(snap.metadata.hasPendingWrites) return; // eco da nossa própria escrita — ignora
    const data = snap.data();
    if(data && data.db){
      fbApplyingRemote = true;
      DB = migrate(JSON.parse(data.db));
      localStorage.setItem(DB_KEY, JSON.stringify(DB));
      fbApplyingRemote = false;
      updateSyncBadge(snap.metadata.fromCache ? 'offline' : 'online');
      if(session){ buildNav(); navigate(currentPage); }
    }
  }, ()=>updateSyncBadge('offline'));
}
async function initFirebaseAndBoot(){
  const localDB = load();
  if(firebaseConfigured() && typeof firebase!=='undefined'){
    updateSyncBadge('connecting');
    try{
      fbApp = firebase.initializeApp(FIREBASE_CONFIG);
      fbDb = firebase.firestore();
      try{ await fbDb.enablePersistence({synchronizeTabs:true}); }catch(e){ /* persistence unavailable in this tab/browser — sync still works, just without offline cache */ }
      fbDocRef = fbDb.collection(FIRESTORE_PATH.collection).doc(FIRESTORE_PATH.doc);
      const snap = await fbDocRef.get();
      if(snap.exists && snap.data() && snap.data().db){
        DB = migrate(JSON.parse(snap.data().db));
        localStorage.setItem(DB_KEY, JSON.stringify(DB));
      } else if(localDB){
        DB = localDB;
        pushToFirebase();
      } else {
        DB = null;
      }
      listenFirebase();
    }catch(e){
      console.error('Firebase indisponível, a usar dados locais.', e);
      DB = localDB;
      updateSyncBadge('offline');
    }
  } else {
    DB = localDB;
    updateSyncBadge('local');
  }
  if(DB){
    document.getElementById('login-screen').style.display='flex';
    initLogin();
  } else {
    document.getElementById('login-screen').style.display='none';
    document.getElementById('setup-screen').style.display='flex';
  }
}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

}
function fmtDate(d){
  if(!d) return '—';

  return dt.toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtDateLong(d){

}

/* Builds a real, empty operational database — no fake clients, staff, or
   sales. The service/product catalog is pre-filled with RNW's actual menu
   (editable) so the owner isn't starting from a blank list, but every
   transactional record starts genuinely empty. */
function bootstrapDB(company, admin){
  const {services, products} = seedCatalog();
  return {
    clients: [], professionals: [], services, products, clientPackages: [],
    appointments: [], sales: [], stockMovements: [], expenses: [], cashSessions: [],
    suppliers: [], serviceCategories: [...SERVICE_CATS_DEFAULT],
    users: [{id:uid(), name:admin.name, role:'Administrador', pin:admin.pin}],
    settings: {
      companyName: company.name || 'RENW Skin Renewal',
      nextInvoice: 1,
      address: company.address || '',
      phone: company.phone || '',
      nuit: company.nuit || '',
      ivaRate: 16, irpcRate: 32,
    },
  };
}

let DB = null;
function load(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw){ return migrate(JSON.parse(raw)); }
  }catch(e){}
  return null; // no data yet — first run needs setup
}
function migrate(db){
  db.expenses = db.expenses || [];
  db.suppliers = db.suppliers || [];
  db.serviceCategories = db.serviceCategories && db.serviceCategories.length ? db.serviceCategories : [...SERVICE_CATS_DEFAULT];
  db.settings.nuit = db.settings.nuit || '';
  db.settings.ivaRate = db.settings.ivaRate!=null ? db.settings.ivaRate : 16;
  db.settings.irpcRate = db.settings.irpcRate!=null ? db.settings.irpcRate : 32;
  db.users.forEach(u=>{ if(!u.id) u.id = uid(); });
  db.clients.forEach(c=>{ if(c.special==null) c.special = false; if(c.superClient==null) c.superClient = false; });
  db.stockMovements.forEach(m=>{ if(m.supplierId===undefined) m.supplierId = null; });
  db.sales.forEach(s=>{ if(!s.installments) s.installments = []; });
  return db;
}
function save(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); scheduleFirebaseSave(); }

/* ---------- toast ---------- */
function toast(msg,type='good'){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast '+type;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(),2800);
}

/* ---------- modal ---------- */
function openModal(title, bodyHtml, footHtml, wide=false){
  const overlay = document.getElementById('overlay');
  const modal = document.getElementById('modal-el');
  modal.className = 'modal' + (wide?' wide':'');
  modal.innerHTML = `
    <div class="modal-head"><h3>${title}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body">${bodyHtml}</div>
    ${footHtml? `<div class="modal-foot">${footHtml}</div>`:''}
  `;
  overlay.classList.add('show');
}
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });

/* ---------- confirm ---------- */
let _confirmCb = null;
function confirmAction(msg, cb){
  _confirmCb = cb;
  openModal('Confirmar', `<p style="font-size:13.5px;color:var(--ink-soft);margin:0;">${msg}</p>`,
    `<button class="btn" onclick="_confirmCb=null;closeModal();">Cancelar</button>
     <button class="btn btn-danger" style="border-color:var(--bad)" onclick="runConfirm();">Confirmar</button>`);
}
function runConfirm(){
  const cb = _confirmCb; _confirmCb = null;
  closeModal();
  if(cb) cb();
}

/* =========================================================================
   AUTH
   ========================================================================= */
let session = null;
let selectedRole = null;
let pinBuf = '';

function initLogin(){
  const roles = [...new Set(DB.users.map(u=>u.role))];
  selectedRole = roles[0];
  const grid = document.getElementById('role-grid');
  grid.innerHTML = roles.map(r=>`<button class="role-btn ${r===selectedRole?'active':''}" data-role="${r}">${r}</button>`).join('');
  grid.querySelectorAll('.role-btn').forEach(b=>b.addEventListener('click',()=>{
    selectedRole=b.dataset.role;
    grid.querySelectorAll('.role-btn').forEach(x=>x.classList.toggle('active',x===b));
    pinBuf=''; renderPinDots(); document.getElementById('login-err').textContent='';
  }));
  renderPinDots();
  const keypad = document.getElementById('keypad');
  const keys = ['1','2','3','4','5','6','7','8','9','⌫','0','OK'];
  keypad.innerHTML = keys.map(k=>`<button class="${k.length>1?'wide':''}" data-k="${k}">${k}</button>`).join('');
  keypad.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>onKey(b.dataset.k)));
}
function renderPinDots(){
  document.getElementById('pin-dots').innerHTML = [0,1,2,3].map(i=>`<div class="pin-dot ${i<pinBuf.length?'filled':''}"></div>`).join('');
}
function onKey(k){
  const err = document.getElementById('login-err');
  if(k==='⌫'){ pinBuf = pinBuf.slice(0,-1); err.textContent=''; renderPinDots(); return; }
  if(k==='OK'){ tryLogin(); return; }
  if(pinBuf.length<4){ pinBuf += k; renderPinDots(); }
  if(pinBuf.length===4) tryLogin();
}
function tryLogin(){
  const user = DB.users.find(u=>u.role===selectedRole && u.pin===pinBuf);
  const err = document.getElementById('login-err');
  if(!user){ err.textContent='PIN incorreto. Tente novamente.'; pinBuf=''; renderPinDots(); return; }
  session = user;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').classList.add('show');
  document.getElementById('side-user-name').textContent = user.name+' · '+user.role;
  buildNav();
  navigate('dashboard');
}
function logout(){
  session=null; pinBuf=''; 
  document.getElementById('app').classList.remove('show');
  document.getElementById('login-screen').style.display='flex';
  initLogin();
}

let currentPage = 'dashboard';
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-backdrop').classList.toggle('show');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-backdrop').classList.remove('show');
}
function buildNav(){
  const nav = document.getElementById('nav-list');
  const allowed = allowedPages();
  nav.innerHTML = NAV.map(item=>{
    if(item.group) return `<div class="nav-group-label">${item.group}</div>`;
    if(!allowed.includes(item.id)) return '';
    return `<div class="nav-item" data-page="${item.id}"><span>${ic(item.icon)}</span><span>${item.label}</span></div>`;
  }).join('');
  // strip group labels that end up with no items under them
  nav.querySelectorAll('.nav-group-label').forEach(lbl=>{
    let sib = lbl.nextElementSibling, hasItem=false;
    while(sib && !sib.classList.contains('nav-group-label')){ if(sib.classList.contains('nav-item')) hasItem=true; sib = sib.nextElementSibling; }
    if(!hasItem) lbl.remove();
  });
  nav.querySelectorAll('.nav-item').forEach(el=>el.addEventListener('click',()=>{
    navigate(el.dataset.page);
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-backdrop').classList.remove('show');
  }));
}
const PAGE_TITLES = {dashboard:'Painel',agenda:'Agenda',vendas:'Vendas / Ponto de Venda',caixa:'Caixa',clientes:'Clientes',servicos:'Serviços',produtos:'Produtos',estoque:'Estoque',profissionais:'Profissionais',relatorios:'Relatórios',contabilidade:'Contabilidade',usuarios:'Utilizadores',config:'Configurações'};
const RENDERERS = {};
function navigate(page){
  if(!canAccess(page)){ page = 'dashboard'; }
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.page===page));
  document.getElementById('page-title').textContent = PAGE_TITLES[page]||'';
  document.getElementById('today-date').textContent = fmtDateLong(today());
  updateCashBadge();
  const container = document.getElementById('page-content');
  container.innerHTML = '';
  (RENDERERS[page]||function(){container.innerHTML='<p>Página não encontrada.</p>';})(container);
}
function updateCashBadge(){
  const badge = document.getElementById('cash-badge');
  const openSession = DB.cashSessions.find(c=>c.status==='aberto');
  if(openSession){
    badge.className='cash-badge open';
    badge.innerHTML = `<span class="dot"></span><span class="label">Caixa aberto</span>`;
  } else {
    badge.className='cash-badge closed';
    badge.innerHTML = `<span class="dot"></span><span class="label">Caixa fechado</span>`;
  }
}

  const apptsDone = apptsToday.filter(a=>a.status==='concluido').length;
  const lowStock = DB.products.filter(p=>p.stock<=p.minStock);
  const activePkgs = DB.clientPackages.filter(p=>p.usedSessions<p.totalSessions).length;
  const birthdaysSoon = DB.clients
    .filter(c=>c.birthday)

  el.innerHTML = `
    <div class="grid-kpi">${kpis.join('')}</div>

    ${birthdaysSoon.length? `
    <div class="section-head"><h2>🎂 Aniversários próximos</h2></div>
    <div class="table-wrap" style="margin-bottom:24px;">
      <table><thead><tr><th>Cliente</th><th>Data</th><th>Contacto</th><th></th></tr></thead>
      <tbody>
        ${birthdaysSoon.map(({c,days})=>`<tr>
          <td><strong>${c.name}</strong></td>
          <td>${fmtDate(c.birthday).slice(0,5)}</td>
          <td>${c.phone||'—'}</td>
          <td>${days===0?`<span class="tag tag-good">Hoje!</span>`:`<span class="tag tag-neutral">em ${days} dia${days===1?'':'s'}</span>`}</td>
        </tr>`).join('')}

    </div>` : ''}

    <div class="section-head"><h2>Agenda de hoje</h2><div class="actions"><button class="btn btn-bronze" onclick="openAppointmentModal()">${ic('plus',14)} Novo agendamento</button></div></div>
    <div class="table-wrap" style="margin-bottom:24px;">

      <tbody>
        ${apptsToday.sort((a,b)=>a.time.localeCompare(b.time)).map(a=>{
          const s = serviceById(a.serviceId);
          return `<tr>
            <td><strong>${a.time}</strong></td>

            <td>${s?s.name:'—'}</td>

    <div class="table-wrap">
      <table><thead><tr><th>Produto</th><th>Categoria</th><th>Stock</th><th>Mínimo</th></tr></thead>

      </tbody></table>
    </div>` : ''}
  `;
};
function daysUntilBirthday(birthdayStr){
  if(!birthdayStr) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  const bd = new Date(birthdayStr+'T00:00:00');
  if(isNaN(bd.getTime())) return null;
  let next = new Date(now.getFullYear(), bd.getMonth(), bd.getDate());
  next.setHours(0,0,0,0);
  if(next < now) next = new Date(now.getFullYear()+1, bd.getMonth(), bd.getDate());
  return Math.round((next-now)/86400000);
}

function openAppointmentModal(id){
  const appt = id ? DB.appointments.find(a=>a.id===id) : null;
  const clientOpts = DB.clients.map(c=>`<option value="${c.id}" ${appt&&appt.clientId===c.id?'selected':''}>${c.name}</option>`).join('');
  const serviceOpts = DB.services.map(s=>`<option value="${s.id}" ${appt&&appt.serviceId===s.id?'selected':''}>${s.category} — ${s.name}</option>`).join('');
  const profOpts = DB.professionals.filter(p=>p.active).map(p=>`<option value="${p.id}" ${appt&&appt.professionalId===p.id?'selected':''}>${p.name}</option>`).join('');
  const statusOpts = Object.keys(STATUS_LABELS).map(k=>`<option value="${k}" ${appt&&appt.status===k?'selected':''}>${STATUS_LABELS[k]}</option>`).join('');

  openModal(appt?'Editar agendamento':'Novo agendamento', `
    <div class="field"><label>Cliente</label><select id="f-client">${clientOpts}</select></div>
    <div class="field"><label>Serviço</label><select id="f-service">${serviceOpts}</select></div>
    <div class="field-row cols-2">
      <div class="field"><label>Data</label><input type="date" id="f-date" value="${appt?appt.date:agendaDate}"></div>
      <div class="field"><label>Hora</label><input type="time" id="f-time" value="${appt?appt.time:'09:00'}"></div>
    </div>
    <div class="field-row cols-2">
      <div class="field"><label>Profissional</label><select id="f-prof">${profOpts}</select></div>
      <div class="field"><label>Estado</label><select id="f-status">${statusOpts}</select></div>
    </div>
    <div class="field"><label>Notas</label><textarea id="f-notes" rows="2">${appt?appt.notes||'':''}</textarea></div>
  `, `
    ${appt? `<button class="btn btn-danger" onclick="deleteAppointment('${appt.id}');closeModal();">Eliminar</button>`:''}
    <button class="btn" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="saveAppointment(${appt?`'${appt.id}'`:'null'})">Guardar</button>
  `);
}
function saveAppointment(id){
  const data = {
    clientId: document.getElementById('f-client').value,
    serviceId: document.getElementById('f-service').value,
    date: document.getElementById('f-date').value,
    time: document.getElementById('f-time').value,
    professionalId: document.getElementById('f-prof').value,
    status: document.getElementById('f-status').value,
    notes: document.getElementById('f-notes').value,
  };
  if(id){
    Object.assign(DB.appointments.find(a=>a.id===id), data);
    toast('Agendamento atualizado.');
  } else {
    DB.appointments.push({id:uid(), linkedPackageId:null, ...data});
    toast('Agendamento criado.');
  }
  save(); closeModal(); navigate(currentPage);
}
function deleteAppointment(id){
  DB.appointments = DB.appointments.filter(a=>a.id!==id);
  save(); toast('Agendamento eliminado.','bad'); navigate(currentPage);
}

function openClientModal(id){
  if(id && !isAdmin()){ toast('Apenas o Administrador pode editar clientes.','bad'); return; }

    <div class="field-row cols-2">
      <div class="field"><label>Telefone</label><input id="f-phone" value="${c?c.phone||'':''}"></div>

    ${isAdmin()? `<div class="field"><label><input type="checkbox" id="f-special" ${c&&c.special?'checked':''}> Cliente especial (preço aberto na venda de produtos, só o Administrador pode vender)</label></div>` : ''}

  `);

function saveClient(id){
  if(id && !isAdmin()){ toast('Apenas o Administrador pode editar clientes.','bad'); return; }
  const name = document.getElementById('f-name').value.trim();
  if(!name){ toast('Indique o nome do cliente.','bad'); return; }
  const specialEl = document.getElementById('f-special');
  const superEl = document.getElementById('f-superclient');
  const data = {name, phone:document.getElementById('f-phone').value.trim(), email:document.getElementById('f-email').value.trim(), birthday:document.getElementById('f-birthday').value||'', notes:document.getElementById('f-notes').value.trim()};
  if(specialEl) data.special = specialEl.checked;
  if(superEl) data.superClient = superEl.checked;
  if(id){ Object.assign(DB.clients.find(c=>c.id===id), data); toast('Cliente atualizado.'); }
  else { DB.clients.push({id:uid(), createdAt:today(), special:false, superClient:false, ...data}); toast('Cliente criado.'); }
  save(); closeModal(); navigate('clientes');
}
function deleteClient(id){
  if(!isAdmin()){ toast('Apenas o Administrador pode eliminar clientes.','bad'); return; }
  const hasHistory = DB.appointments.some(a=>a.clientId===id) || DB.sales.some(s=>s.clientId===id) || DB.clientPackages.some(p=>p.clientId===id);
  const msg = hasHistory
    ? 'Este cliente tem marcações, vendas ou pacotes associados. O histórico existente não será apagado, mas deixará de estar ligado a um nome de cliente. Eliminar mesmo assim?'
    : 'Eliminar este cliente?';
  confirmAction(msg, ()=>{
    DB.clients = DB.clients.filter(c=>c.id!==id);
    save(); toast('Cliente eliminado.','bad'); navigate('clientes');
  });
}
function openClientProfile(id){
  const c = DB.clients.find(x=>x.id===id);
  const pkgs = DB.clientPackages.filter(p=>p.clientId===id);
  const history = DB.appointments.filter(a=>a.clientId===id).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  const salesHist = DB.sales.filter(s=>s.clientId===id);
  const spent = salesHist.reduce((a,s)=>a+s.total,0);
  const creditBalance = salesHist.filter(s=>s.paymentMethod==='Crédito (Super Cliente)')
    .reduce((a,s)=>a+(s.installments||[]).filter(i=>i.status==='pendente').reduce((x,i)=>x+i.amount,0),0);
  openModal('Perfil — '+c.name+(c.superClient?' ♦':'')+(c.special?' ★':''), `
    <div class="field-row cols-2" style="margin-bottom:16px;">
      <div class="panel" style="margin-bottom:0;padding:12px 14px;"><div style="font-size:11px;color:var(--ink-soft);font-weight:700;">TOTAL GASTO</div><div style="font-family:'Fraunces',serif;font-size:19px;font-weight:600;">${fmt(spent)}</div></div>
      <div class="panel" style="margin-bottom:0;padding:12px 14px;"><div style="font-size:11px;color:var(--ink-soft);font-weight:700;">CONTACTO</div><div style="font-size:13px;">${c.phone||'—'}</div>${c.birthday?`<div style="font-size:11px;color:var(--ink-soft);margin-top:4px;">🎂 ${fmtDate(c.birthday)}</div>`:''}</div>
    </div>
    ${c.superClient? `<div class="panel" style="margin-bottom:16px;padding:12px 14px;border-color:${creditBalance>0?'var(--warn)':'var(--line)'};"><div style="font-size:11px;color:var(--ink-soft);font-weight:700;">SALDO EM CRÉDITO (SUPER CLIENTE)</div><div style="font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:${creditBalance>0?'var(--warn)':'var(--ink)'};">${fmt(creditBalance)}</div></div>` : ''}
    <h3 style="font-size:13.5px;margin:0 0 8px;">Pacotes</h3>
    ${pkgs.length? pkgs.map(p=>`
      <div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;"><span>${p.serviceName}</span><span>${p.usedSessions}/${p.totalSessions} sessões</span></div>
        <div class="progress-bar"><div style="width:${Math.min(100,p.usedSessions/p.totalSessions*100)}%"></div></div>
      </div>`).join('') : `<p style="font-size:12.5px;color:var(--ink-soft);">Sem pacotes.</p>`}
    <h3 style="font-size:13.5px;margin:16px 0 8px;">Histórico de marcações</h3>
    <div style="max-height:180px;overflow-y:auto;">
    ${history.length? history.map(a=>{
      const s=serviceById(a.serviceId);
      return `<div style="display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px solid var(--line);">
        <span>${fmtDate(a.date)} ${a.time} — ${s?s.name:''}</span><span class="tag ${STATUS_TAG[a.status]}">${STATUS_LABELS[a.status]}</span></div>`;
    }).join('') : `<p style="font-size:12.5px;color:var(--ink-soft);">Sem histórico.</p>`}
    </div>
  `, `<button class="btn" onclick="closeModal()">Fechar</button>${isAdmin()?`<button class="btn btn-primary" onclick="closeModal();openClientModal('${c.id}')">Editar dados</button>`:''}`, true);
}

function openCategoryModal(){
  openModal('Gerir categorias de serviço', `
    <div id="cat-list">${renderCategoryList()}</div>
    <div class="field" style="margin-top:14px;"><label>Nova categoria</label>
      <div style="display:flex;gap:8px;">
        <input id="f-newcat" placeholder="Ex: Massagem Relaxante" style="flex:1;">
        <button class="btn btn-primary" onclick="addCategory()">Adicionar</button>
      </div>
    </div>
  `, `<button class="btn" onclick="closeModal();navigate('servicos')">Fechar</button>`, true);
}
function renderCategoryList(){
  return serviceCats().map(cat=>{
    const count = DB.services.filter(s=>s.category===cat).length;
    return `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);">
      <input value="${cat}" id="cat-input-${btoa(unescape(encodeURIComponent(cat)))}" style="flex:1;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;">
      <span style="font-size:11px;color:var(--ink-soft);white-space:nowrap;">${count} serviço(s)</span>
      <button class="btn btn-sm" onclick="renameCategory('${cat.replace(/'/g,"\\'")}')">Guardar</button>
      <button class="btn btn-sm btn-danger" onclick="deleteCategory('${cat.replace(/'/g,"\\'")}')">${ic('trash',13)}</button>
    </div>`;
  }).join('');
}
function addCategory(){
  const input = document.getElementById('f-newcat');
  const name = input.value.trim();
  if(!name){ toast('Indique um nome para a categoria.','bad'); return; }
  if(serviceCats().includes(name)){ toast('Já existe uma categoria com esse nome.','bad'); return; }
  DB.serviceCategories = [...serviceCats(), name];
  save(); toast('Categoria adicionada.');
  document.getElementById('cat-list').innerHTML = renderCategoryList();
  input.value = '';
}
function renameCategory(oldName){
  const inputId = 'cat-input-'+btoa(unescape(encodeURIComponent(oldName)));
  const newName = document.getElementById(inputId).value.trim();
  if(!newName){ toast('O nome não pode ficar vazio.','bad'); return; }
  if(newName!==oldName && serviceCats().includes(newName)){ toast('Já existe uma categoria com esse nome.','bad'); return; }
  DB.serviceCategories = serviceCats().map(c=>c===oldName?newName:c);
  DB.services.forEach(s=>{ if(s.category===oldName) s.category = newName; });
  save(); toast('Categoria atualizada.');
  document.getElementById('cat-list').innerHTML = renderCategoryList();
}
function deleteCategory(name){
  const count = DB.services.filter(s=>s.category===name).length;
  if(serviceCats().length<=1){ toast('Tem de existir pelo menos uma categoria.','bad'); return; }
  const msg = count>0
    ? `Esta categoria tem ${count} serviço(s) associado(s), que ficarão sem categoria válida. Elimine ou reclassifique esses serviços primeiro, ou continue mesmo assim?`
    : 'Eliminar esta categoria?';
  confirmAction(msg, ()=>{
    DB.serviceCategories = serviceCats().filter(c=>c!==name);
    save(); toast('Categoria eliminada.','bad');
    if(servicoCat===name) servicoCat = 'Todos';
    document.getElementById('cat-list').innerHTML = renderCategoryList();
    navigate('servicos');
  });
}

          <td>${m.qty}</td><td>${sup?sup.name:'—'}</td><td>${m.reason||'—'}</td>

function openStockMoveModal(){
  openModal('Movimento de stock', `
    <div class="field"><label>Produto</label><select id="f-product">${DB.products.map(p=>`<option value="${p.id}">${p.name} (stock: ${p.stock})</option>`).join('')}</select></div>
    <div class="field-row cols-2">
      <div class="field"><label>Tipo</label><select id="f-type" onchange="toggleStockMoveSupplier()"><option value="entrada">Entrada (reposição)</option><option value="saida">Saída (perda/uso interno)</option><option value="ajuste">Ajuste de inventário</option></select></div>
      <div class="field"><label>Quantidade</label><input type="number" id="f-qty" value="1"></div>
    </div>
    <div class="field" id="f-supplier-wrap"><label>Fornecedor (opcional)</label><select id="f-supplier">
      <option value="">—</option>
      ${DB.suppliers.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}
    </select></div>
    <div class="field"><label>Motivo</label><input id="f-reason" placeholder="Ex: Reposição de fornecedor"></div>
  `, `<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveStockMove()">Registar</button>`);
}
function toggleStockMoveSupplier(){
  const t = document.getElementById('f-type').value;
  document.getElementById('f-supplier-wrap').style.display = t==='entrada'?'block':'none';
}
function saveStockMove(){
  const productId = document.getElementById('f-product').value;
  const type = document.getElementById('f-type').value;
  const qty = Number(document.getElementById('f-qty').value)||0;
  const reason = document.getElementById('f-reason').value.trim();
  const supplierId = (type==='entrada' && document.getElementById('f-supplier').value) || null;
  const p = productById(productId);
  if(type==='entrada') p.stock += qty;
  else if(type==='saida') p.stock = Math.max(0,p.stock-qty);
  else p.stock = qty;
  DB.stockMovements.push({id:uid(), productId, type, qty, reason, supplierId, date:today()});
  save(); closeModal(); toast('Movimento registado.'); navigate('estoque');
}

let cart = [];
let posTab = 'servicos';
let posClientId = '';
RENDERERS.vendas = function(el){

              const label = c.superClient? '♦ Super Cliente — pode comprar a crédito, com preços/descontos definidos pelo Administrador' : '★ Cliente especial — produtos vendidos com preço aberto';

            } return ''; })()}

        </div>

  `;
};
function cartTotal(){ return cart.reduce((a,i)=>a+i.price*i.qty,0); }
function renderCartItems(){
  if(!cart.length) return `<p style="font-size:12.5px;color:var(--ink-soft);text-align:center;margin-top:30px;">Carrinho vazio.<br>Selecione serviços ou produtos.</p>`;
  return cart.map((item,idx)=>`
    <div class="cart-line">
      <div style="flex:1;">
        <div style="font-weight:700;">${item.name}${item.openPrice?' <span class="tag tag-warn" style="font-size:9.5px;">Preço aberto</span>':''}</div>
        <div style="color:var(--ink-soft);font-size:11px;">${item.category||''}</div>
        ${item.type==='product' ? `<div class="qty-ctrl"><button onclick="changeQty(${idx},-1)">-</button><span>${item.qty}</span><button onclick="changeQty(${idx},1)">+</button></div>` : ''}
      </div>
      <div style="text-align:right;">
        <div style="font-weight:700;">${fmt(item.price*item.qty)}</div>
        <button class="btn btn-sm btn-danger" style="margin-top:4px;" onclick="removeFromCart(${idx})">Remover</button>
      </div>
    </div>`).join('');
}
function renderCartTotals(){
  return `<div class="pos-totals-row total"><span>Total</span><span>${fmt(cartTotal())}</span></div>`;
}
function addToCart(type,id){
  if(type==='service'){
    const s = serviceById(id);
    cart.push({type:'service', refId:s.id, name:s.name, category:s.category, price: s.type==='pacote'?s.packagePrice:s.price, qty:1, isPackage:s.type==='pacote', packageSessions:s.packageSessions});
  } else {
    const p = productById(id);
    const client = posClientId ? DB.clients.find(c=>c.id===posClientId) : null;
    if(client && (client.special || client.superClient)){
      if(!isAdmin()){ toast('Este cliente tem preços especiais — a venda de produtos a este cliente só pode ser feita pelo Administrador.','bad'); return; }
      const label = client.superClient ? `preço/desconto para Super Cliente` : `Preço aberto`;
      const input = window.prompt(`${label} — "${p.name}" (cliente: ${client.name})`, p.price);
      if(input===null) return;
      const openPrice = Number(input);
      if(!openPrice || openPrice<0){ toast('Preço inválido.','bad'); return; }
      const existingOpen = cart.find(i=>i.type==='product' && i.refId===p.id && i.openPrice);
      if(existingOpen){ if(existingOpen.qty < p.stock){ existingOpen.qty++; } else { toast('Stock insuficiente.','bad'); return; } }
      else cart.push({type:'product', refId:p.id, name:p.name, category:p.category, price:openPrice, qty:1, openPrice:true});
      navigate('vendas'); return;
    }
    const existing = cart.find(i=>i.type==='product' && i.refId===p.id && !i.openPrice);
    if(existing){ if(existing.qty < p.stock) existing.qty++; else { toast('Stock insuficiente.','bad'); return; } }
    else cart.push({type:'product', refId:p.id, name:p.name, category:p.category, price:p.price, qty:1});
  }
  navigate('vendas');
}
function changeQty(idx,delta){
  const item = cart[idx];
  if(item.type!=='product') return;
  const p = productById(item.refId);
  const newQty = item.qty+delta;
  if(newQty<1){ removeFromCart(idx); return; }
  if(newQty>p.stock){ toast('Stock insuficiente.','bad'); return; }
  item.qty = newQty; navigate('vendas');
}
function removeFromCart(idx){ cart.splice(idx,1); navigate('vendas'); }

function openCheckoutModal(){
  const client = posClientId ? DB.clients.find(c=>c.id===posClientId) : null;
  const availableMethods = PAY_METHODS.filter(m=> m!=='Crédito (Super Cliente)' || (client && client.superClient));
  openModal('Finalizar venda', `
    <div style="max-height:200px;overflow-y:auto;margin-bottom:14px;">
      ${cart.map(i=>`<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;"><span>${i.qty}x ${i.name}</span><span>${fmt(i.price*i.qty)}</span></div>`).join('')}
    </div>
    <div class="field"><label>Desconto (MT)</label><input type="number" id="f-discount" value="0" oninput="updateCheckoutTotal()"></div>
    <div class="field"><label>Método de pagamento</label><select id="f-paymethod" onchange="toggleInstallmentFields()">${availableMethods.map(m=>`<option>${m}</option>`).join('')}</select></div>
    <div id="f-installment-wrap" style="display:none;background:var(--cream);border-radius:8px;padding:12px 14px;margin-bottom:13px;">
      <div class="field-row cols-2">
        <div class="field" style="margin-bottom:8px;"><label>Nº de parcelas</label><input type="number" id="f-installments" value="2" min="2" max="24" oninput="updateCheckoutTotal()"></div>
        <div class="field" style="margin-bottom:8px;"><label>Intervalo (dias)</label><input type="number" id="f-installmentgap" value="30"></div>
      </div>
      <div class="field" style="margin-bottom:0;"><label>Data da 1ª parcela</label><input type="date" id="f-installmentstart" value="${today()}"></div>
      <p style="font-size:11px;color:var(--ink-soft);margin:8px 0 0;">As parcelas ficam registadas como pendentes e podem ser marcadas como pagas em Contabilidade → Parcelamentos.</p>
    </div>
    <div id="f-credit-wrap" style="display:none;background:var(--cream);border-radius:8px;padding:12px 14px;margin-bottom:13px;">
      <p style="font-size:11px;color:var(--ink-soft);margin:0;">Valor total fica registado como saldo em aberto de <strong>${client?client.name:'—'}</strong>. Pode ser liquidado a qualquer momento em Contabilidade → Parcelamentos.</p>
    </div>
    <div class="field"><label>Profissional (comissão)</label><select id="f-payprof"><option value="">—</option>${DB.professionals.filter(p=>p.active).map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div>
    <div class="field"><label>Documento a emitir</label><select id="f-doctype"><option value="Fatura-Recibo">Fatura-Recibo</option><option value="Fatura">Fatura</option><option value="Recibo">Recibo</option></select></div>
    <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:700;font-family:'Fraunces',serif;border-top:1px solid var(--line);padding-top:12px;margin-top:8px;">
      <span>Total</span><span id="checkout-total">${fmt(cartTotal())}</span>
    </div>
  `, `<button class="btn" onclick="closeModal()">Voltar</button><button class="btn btn-primary" onclick="finalizeSale()">Confirmar pagamento</button>`);
}
function toggleInstallmentFields(){
  const method = document.getElementById('f-paymethod').value;
  document.getElementById('f-installment-wrap').style.display = method==='Pagamento Parcelado' ? 'block':'none';
  document.getElementById('f-credit-wrap').style.display = method==='Crédito (Super Cliente)' ? 'block':'none';
}
function updateCheckoutTotal(){
  const d = Number(document.getElementById('f-discount').value)||0;
  document.getElementById('checkout-total').textContent = fmt(Math.max(0,cartTotal()-d));
}
function finalizeSale(){
  const discount = Number(document.getElementById('f-discount').value)||0;
  const paymentMethod = document.getElementById('f-paymethod').value;
  const professionalId = document.getElementById('f-payprof').value;
  const docType = document.getElementById('f-doctype').value;
  const total = Math.max(0, cartTotal()-discount);
  const openSession = DB.cashSessions.find(c=>c.status==='aberto');
  const client = posClientId ? DB.clients.find(c=>c.id===posClientId) : null;

  if(paymentMethod==='Crédito (Super Cliente)' && !(client && client.superClient)){
    toast('Selecione um cliente marcado como Super Cliente para usar Crédito.','bad'); return;
  }

  let installments = [];
  if(paymentMethod==='Pagamento Parcelado'){
    const n = Math.max(2, Number(document.getElementById('f-installments').value)||2);
    const gap = Number(document.getElementById('f-installmentgap').value)||30;
    const startDate = document.getElementById('f-installmentstart').value || today();
    const base = Math.floor((total/n)*100)/100;
    let allocated = 0;
    for(let i=0;i<n;i++){
      const due = new Date(startDate+'T00:00:00');
      due.setDate(due.getDate()+gap*i);
      const amount = (i===n-1) ? Math.round((total-allocated)*100)/100 : base;
      allocated += amount;
      installments.push({id:uid(), n:i+1, of:n, amount, dueDate:due.toISOString().slice(0,10), status:'pendente', paidDate:null});
    }
  } else if(paymentMethod==='Crédito (Super Cliente)'){
    installments.push({id:uid(), n:1, of:1, amount:total, dueDate:today(), status:'pendente', paidDate:null});
  }

  // stock deduction
  cart.forEach(item=>{
    if(item.type==='product'){
      const p = productById(item.refId);
      p.stock = Math.max(0, p.stock-item.qty);
      DB.stockMovements.push({id:uid(),productId:p.id,type:'saida',qty:item.qty,reason:'Venda',date:today()});
    }
    if(item.type==='service' && item.isPackage){
      DB.clientPackages.push({id:uid(), clientId:posClientId||null, serviceId:item.refId, serviceName:item.name, category:item.category, totalSessions:item.packageSessions, usedSessions:0, purchaseDate:today(), price:item.price});
    }
  });

  const sale = {
    id:uid(), invoice:DB.settings.nextInvoice, docType, date:today(), time:nowTime(),
    clientId: posClientId||null, items:cart.map(i=>({...i})), subtotal:cartTotal(), discount, total,
    paymentMethod, installments, professionalId: professionalId||null, cashSessionId: openSession? openSession.id : null,
  };
  DB.sales.push(sale);
  DB.settings.nextInvoice++;
  cart = []; posClientId='';
  save(); closeModal();
  toast('Venda registada com sucesso.');
  printReceipt(sale);
  navigate('vendas');
}
function printReceipt(sale){
  const client = sale.clientId? clientName(sale.clientId) : 'Cliente avulso';
  const docLabel = (sale.docType || 'Fatura-Recibo').toUpperCase();
  const prof = sale.professionalId ? profName(sale.professionalId) : null;
  const html = `
    <div style="font-family:'Manrope',sans-serif;max-width:320px;margin:0 auto;">
      <div style="text-align:center;margin-bottom:10px;">
        <img src="${LOGO_B64}" style="width:72px;height:72px;border-radius:50%;object-fit:cover;margin-bottom:6px;">
        <div style="font-family:'Fraunces',serif;font-weight:700;font-size:20px;">${DB.settings.companyName.split(' ')[0]}</div>
        <div style="font-size:9.5px;letter-spacing:2px;">SKIN RENEWAL</div>
        <div style="font-size:10.5px;color:#555;margin-top:3px;">${DB.settings.address}${DB.settings.phone?' · '+DB.settings.phone:''}</div>
        ${DB.settings.nuit? `<div style="font-size:10.5px;color:#555;">NUIT: ${DB.settings.nuit}</div>` : ''}
      </div>
      <div style="text-align:center;font-weight:700;font-size:12px;letter-spacing:1px;border-top:1px solid #333;border-bottom:1px solid #333;padding:5px 0;margin:8px 0 6px;">${docLabel}</div>
      <div style="font-size:11px;padding:2px 0 8px;">
        Nº ${String(sale.invoice).padStart(5,'0')} · ${fmtDate(sale.date)} ${sale.time}<br>
        Cliente: ${client}${prof? `<br>Atendido por: ${prof}`:''}
      </div>

RENDERERS.caixa = function(el){
  const openSession = DB.cashSessions.find(c=>c.status==='aberto');
  const history = [...DB.cashSessions].filter(c=>c.status==='fechado').sort((a,b)=>b.closedAt.localeCompare(a.closedAt)).slice(0,15);

  if(!openSession){
    el.innerHTML = `
      <div class="panel" style="max-width:420px;">
        <h2 style="margin-top:0;font-size:17px;">Abrir caixa</h2>
        <div class="field"><label>Valor de abertura (fundo de troco)</label><input type="number" id="f-opening" value="0"></div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="openCash()">Abrir caixa</button>
      </div>
      <div class="section-head" style="margin-top:26px;"><h2>Histórico de fechos</h2></div>
      ${renderCashHistory(history)}
    `;
    return;
  }
  const sessionSales = DB.sales.filter(s=>s.cashSessionId===openSession.id);
  const byMethod = {};
  PAY_METHODS.forEach(m=>byMethod[m]=0);
  sessionSales.forEach(s=>byMethod[s.paymentMethod]=(byMethod[s.paymentMethod]||0)+s.total);
  const expected = openSession.openingAmount + (byMethod['Numerário']||0);

  el.innerHTML = `
    <div class="grid-kpi">
      <div class="kpi-card"><div class="label">Aberto às</div><div class="value" style="font-size:19px;">${openSession.openedAt.slice(11,16)}</div><div class="sub">fundo: ${fmt(openSession.openingAmount)}</div></div>
      <div class="kpi-card"><div class="label">Vendas na sessão</div><div class="value">${sessionSales.length}</div><div class="sub">${fmt(sessionSales.reduce((a,s)=>a+s.total,0))}</div></div>
      <div class="kpi-card"><div class="label">Numerário esperado</div><div class="value">${fmt(expected)}</div><div class="sub">fundo + vendas em dinheiro</div></div>
    </div>
    <div class="panel">
      <h3 style="margin-top:0;font-size:14px;">Totais por método de pagamento</h3>
      ${PAY_METHODS.map(m=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);"><span>${m}</span><strong>${fmt(byMethod[m]||0)}</strong></div>`).join('')}
    </div>
    <div class="panel">
      <h3 style="margin-top:0;font-size:14px;">Fechar caixa</h3>
      <div class="field"><label>Valor contado em numerário</label><input type="number" id="f-closing" value="${expected}"></div>
      <button class="btn btn-danger" style="border:1px solid var(--bad);width:100%;justify-content:center;" onclick="closeCash('${openSession.id}', ${expected})">Fechar caixa</button>
    </div>
    <div class="section-head" style="margin-top:10px;"><h2>Histórico de fechos</h2></div>
    ${renderCashHistory(history)}
  `;
};
function renderCashHistory(history){
  const isAdmin = session && session.role==='Administrador';
  return `<div class="table-wrap">
    <table><thead><tr><th>Data</th><th>Abertura</th><th>Fecho</th><th>Esperado</th><th>Contado</th><th>Diferença</th>${isAdmin?'<th></th>':''}</tr></thead>
    <tbody>${history.map(c=>`<tr>
      <td>${fmtDate(c.openedAt.slice(0,10))}</td><td>${fmt(c.openingAmount)}</td><td>${fmt(c.closingAmount)}</td>
      <td>${fmt(c.expectedTotal)}</td><td>${fmt(c.closingAmount)}</td>
      <td style="color:${c.difference<0?'var(--bad)':(c.difference>0?'var(--warn)':'var(--good)')};font-weight:700;">${c.difference>0?'+':''}${fmt(c.difference)}</td>
      ${isAdmin?`<td><button class="btn btn-sm btn-danger" onclick="deleteCashSession('${c.id}')">${ic('trash',13)}</button></td>`:''}
    </tr>`).join('') || `<tr class="empty-row"><td colspan="${isAdmin?7:6}">Sem fechos registados ainda.</td></tr>`}</tbody></table>
  </div>`;
}
function deleteCashSession(id){
  confirmAction('Eliminar este registo histórico de caixa? As vendas associadas não são apagadas, apenas o registo de abertura/fecho.', ()=>{
    DB.cashSessions = DB.cashSessions.filter(c=>c.id!==id);
    save(); toast('Registo de caixa eliminado.','bad'); navigate('caixa');
  });
}
function openCash(){
  const opening = Number(document.getElementById('f-opening').value)||0;
  DB.cashSessions.push({id:uid(), status:'aberto', openedAt:new Date().toISOString(), openedBy:session?session.name:'—', openingAmount:opening, closedAt:null, closedBy:null, closingAmount:0, expectedTotal:0, difference:0});
  save(); toast('Caixa aberto.'); navigate('caixa');
}
function closeCash(id, expected){
  const counted = Number(document.getElementById('f-closing').value)||0;
  const s = DB.cashSessions.find(c=>c.id===id);
  s.status='fechado'; s.closedAt=new Date().toISOString(); s.closedBy = session?session.name:'—';
  s.closingAmount = counted; s.expectedTotal = expected; s.difference = counted-expected;
  save(); toast('Caixa fechado.'); navigate('caixa');
}

  `;
};
function openUserModal(id){
  const u = id ? DB.users.find(x=>x.id===id) : null;
  const roles = ['Administrador','Recepção','Esteticista'];
  openModal(u?'Editar utilizador':'Novo utilizador', `
    <div class="field"><label>Nome</label><input id="f-uname" value="${u?u.name:''}"></div>
    <div class="field"><label>Perfil</label><select id="f-urole">${roles.map(r=>`<option ${u&&u.role===r?'selected':''}>${r}</option>`).join('')}</select></div>
    <div class="field"><label>PIN (4 dígitos)</label><input id="f-upin" maxlength="4" inputmode="numeric" value="${u?u.pin:''}" placeholder="Ex: 1234"></div>
  `, `
    <button class="btn" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="saveUser(${u?`'${u.id}'`:'null'})">Guardar</button>
  `);
}
function saveUser(id){
  const name = document.getElementById('f-uname').value.trim();
  const role = document.getElementById('f-urole').value;
  const pin = document.getElementById('f-upin').value.trim();
  if(!name){ toast('Indique o nome.','bad'); return; }
  if(!/^\d{4}$/.test(pin)){ toast('O PIN deve ter exatamente 4 dígitos.','bad'); return; }
  const clash = DB.users.find(u=>u.role===role && u.pin===pin && u.id!==id);
  if(clash){ toast('Já existe um utilizador com este PIN neste perfil.','bad'); return; }
  if(id){ Object.assign(DB.users.find(u=>u.id===id), {name,role,pin}); toast('Utilizador atualizado.'); if(session&&session.id===id) session={id,name,role,pin}; }
  else { DB.users.push({id:uid(), name, role, pin}); toast('Utilizador criado.'); }
  save(); closeModal(); navigate('usuarios');
}
function deleteUser(id){
  const u = DB.users.find(x=>x.id===id);
  if(u.role==='Administrador' && DB.users.filter(x=>x.role==='Administrador').length<=1){
    toast('Tem de existir pelo menos um Administrador.','bad'); return;
  }
  if(session && session.id===id){ toast('Não pode eliminar o utilizador com sessão ativa.','bad'); return; }
  confirmAction('Eliminar o utilizador "'+u.name+'"?', ()=>{
    DB.users = DB.users.filter(x=>x.id!==id); save(); toast('Utilizador eliminado.','bad'); navigate('usuarios');
  });
}

let contabTab = 'balancete';

RENDERERS.contabilidade = function(el){

    <div id="contab-body"></div>
    <p style="font-size:11px;color:var(--ink-soft);margin-top:18px;">Estes mapas são um apoio de gestão simplificado, gerado automaticamente a partir das vendas, despesas e estoque registados no sistema. Não substituem a contabilidade organizada exigida por lei nem a validação de um contabilista certificado.</p>
  `;

  if(contabTab==='balancete') renderBalancete(body, monthSales, monthExpenses);

function renderParcelamentos(el){
  const rows = [];
  DB.sales.forEach(s=>{
    (s.installments||[]).forEach(inst=>{
      rows.push({sale:s, inst, isCredit: s.paymentMethod==='Crédito (Super Cliente)'});
    });
  });
  rows.sort((a,b)=> (a.inst.status===b.inst.status?0:(a.inst.status==='pendente'?-1:1)) || a.inst.dueDate.localeCompare(b.inst.dueDate));
  const pendingTotal = rows.filter(r=>r.inst.status==='pendente').reduce((a,r)=>a+r.inst.amount,0);
  const overdueCount = rows.filter(r=>r.inst.status==='pendente' && r.inst.dueDate<today()).length;
  const creditPending = rows.filter(r=>r.isCredit && r.inst.status==='pendente').reduce((a,r)=>a+r.inst.amount,0);
  el.innerHTML = `
    <div class="grid-kpi">
      <div class="kpi-card"><div class="label">Total pendente</div><div class="value">${fmt(pendingTotal)}</div></div>
      <div class="kpi-card"><div class="label">Em atraso</div><div class="value" style="color:${overdueCount?'var(--bad)':'var(--ink)'}">${overdueCount}</div></div>
      <div class="kpi-card"><div class="label">Saldo em crédito (Super Clientes)</div><div class="value">${fmt(creditPending)}</div></div>
    </div>
    <div class="table-wrap">
      <table><thead><tr><th>Cliente</th><th>Venda Nº</th><th>Tipo</th><th>Vencimento</th><th>Valor</th><th>Estado</th><th></th></tr></thead>
      <tbody>
        ${rows.map(({sale,inst,isCredit})=>{
          const overdue = inst.status==='pendente' && inst.dueDate<today();
          return `<tr>
            <td>${sale.clientId? clientName(sale.clientId) : 'Cliente avulso'}</td>
            <td>${String(sale.invoice).padStart(5,'0')}</td>
            <td>${isCredit? `<span class="tag tag-good">Crédito</span>` : `Parcela ${inst.n}/${inst.of}`}</td>
            <td>${fmtDate(inst.dueDate)}${overdue?` <span class="tag tag-bad">Atrasada</span>`:''}</td>

function markInstallmentPaid(saleId, instId){

function computeBalancete(monthSales, monthExpenses){
  const receitaServicos = monthSales.reduce((a,s)=>a+s.items.filter(i=>i.type==='service').reduce((x,i)=>x+i.price*i.qty,0),0);
  const receitaProdutos = monthSales.reduce((a,s)=>a+s.items.filter(i=>i.type==='product').reduce((x,i)=>x+i.price*i.qty,0),0);
  const descontos = monthSales.reduce((a,s)=>a+s.discount,0);
  const cmv = monthSales.reduce((a,s)=>a+s.items.filter(i=>i.type==='product').reduce((x,i)=>{ const p=productById(i.refId); return x+(p?p.cost:0)*i.qty; },0),0);
  const comissoes = monthSales.reduce((a,s)=>{ if(!s.professionalId) return a; const prof=DB.professionals.find(p=>p.id===s.professionalId); return a+(prof? s.total*prof.commissionRate/100 : 0); },0);
  const despesasGerais = monthExpenses.reduce((a,e)=>a+e.amount,0);
  const disponibilidades = {}; PAY_METHODS.forEach(m=>disponibilidades[m]=0);
  monthSales.forEach(s=>disponibilidades[s.paymentMethod]=(disponibilidades[s.paymentMethod]||0)+s.total);
  const valorInventario = DB.products.reduce((a,p)=>a+p.cost*p.stock,0);
  const debitos = [
    ['Custo das Mercadorias Vendidas (CMV)', cmv],
    ['Comissões a Profissionais', comissoes],
    ['Descontos Concedidos', descontos],
    ['Despesas Gerais', despesasGerais],
  ];
  const creditos = [
    ['Vendas de Serviços', receitaServicos],
    ['Vendas de Produtos', receitaProdutos],
  ];
  const totalDeb = debitos.reduce((a,[,v])=>a+v,0);
  const totalCred = creditos.reduce((a,[,v])=>a+v,0);
  return {debitos, creditos, totalDeb, totalCred, resultado: totalCred-totalDeb, disponibilidades, valorInventario};
}

function computeIva(monthSales, monthExpenses){
  const rate = DB.settings.ivaRate;
  const vendasTotal = monthSales.reduce((a,s)=>a+s.total,0);
  const ivaLiquidado = vendasTotal * rate/(100+rate); // assumes prices are IVA-inclusive
  const comprasComIva = monthExpenses.filter(e=>e.hasVat);
  const ivaDedutivel = comprasComIva.reduce((a,e)=>a+(e.vatAmount||0),0);
  return {rate, ivaLiquidado, comprasComIva, ivaDedutivel, apurado: ivaLiquidado-ivaDedutivel};
}
function renderIva(el, monthSales, monthExpenses){
  const d = computeIva(monthSales, monthExpenses);
  el.innerHTML = `
    <div class="section-head"><div></div><div class="actions"><button class="btn" onclick="printContabilidade()">${ic('box',13)} Imprimir</button></div></div>
    <div class="grid-kpi">
      <div class="kpi-card"><div class="label">IVA liquidado (sobre vendas)</div><div class="value">${fmt(d.ivaLiquidado)}</div><div class="sub">taxa ${d.rate}% · valores de venda com IVA incluído</div></div>
      <div class="kpi-card"><div class="label">IVA dedutível (sobre compras)</div><div class="value">${fmt(d.ivaDedutivel)}</div><div class="sub">${d.comprasComIva.length} despesa(s) com IVA</div></div>
      <div class="kpi-card"><div class="label">${d.apurado>=0?'IVA a pagar':'Crédito de IVA'}</div><div class="value" style="color:${d.apurado>=0?'var(--bad)':'var(--good)'}">${fmt(Math.abs(d.apurado))}</div></div>
    </div>
    <div class="panel">
      <h3 style="margin-top:0;font-size:14px;">Como este valor é calculado</h3>
      <p style="font-size:12.5px;color:var(--ink-soft);line-height:1.6;">
        IVA liquidado = Total de vendas do mês × ${d.rate} ÷ (100 + ${d.rate}), assumindo que os preços praticados já incluem IVA.<br>
        IVA dedutível = soma do IVA registado nas despesas/compras do mês marcadas como "com IVA" (ver separador Despesas / Compras).<br>
        Apuramento = IVA liquidado − IVA dedutível. Confirme sempre estes valores com o seu contabilista antes de submeter a declaração periódica na Autoridade Tributária.
      </p>
    </div>
  `;
}

function computeIrpc(monthSales, monthExpenses){
  const rate = DB.settings.irpcRate;
  const receita = monthSales.reduce((a,s)=>a+s.total,0);
  const cmv = monthSales.reduce((a,s)=>a+s.items.filter(i=>i.type==='product').reduce((x,i)=>{ const p=productById(i.refId); return x+(p?p.cost:0)*i.qty; },0),0);
  const comissoes = monthSales.reduce((a,s)=>{ if(!s.professionalId) return a; const prof=DB.professionals.find(p=>p.id===s.professionalId); return a+(prof? s.total*prof.commissionRate/100 : 0); },0);
  const despesas = monthExpenses.reduce((a,e)=>a+e.amount,0);
  const custosTotal = cmv+comissoes+despesas;
  const lucroTributavel = Math.max(0, receita-custosTotal);
  return {rate, receita, custosTotal, lucroTributavel, irpcEstimado: lucroTributavel*rate/100};
}
function renderIrpc(el, monthSales, monthExpenses){
  const d = computeIrpc(monthSales, monthExpenses);
  el.innerHTML = `

      <div class="kpi-card"><div class="label">Lucro tributável (estimado)</div><div class="value">${fmt(d.lucroTributavel)}</div></div>
      <div class="kpi-card"><div class="label">IRPC estimado (${d.rate}%)</div><div class="value" style="color:var(--bad)">${fmt(d.irpcEstimado)}</div></div>
    </div>
    <div class="panel">
      <h3 style="margin-top:0;font-size:14px;">Nota</h3>
      <p style="font-size:12.5px;color:var(--ink-soft);line-height:1.6;">
        Esta é uma estimativa simplificada de apuramento do IRPC (lucro tributável × ${d.rate}%), baseada apenas nas vendas, custo das mercadorias vendidas, comissões e despesas registadas neste sistema.
        Não considera amortizações, provisões, benefícios fiscais, pagamentos por conta já efetuados, nem outros ajustamentos fiscais previstos no Código do IRPC. Use como indicador de gestão e valide sempre o apuramento definitivo com um contabilista certificado.
      </p>
    </div>
  `;
}

/* -------- PWA: installable app icon + offline shell caching -------- */
function setupPWA(){
  try{
    // Web App Manifest (built in-memory so the app stays a single file)
    const manifest = {
      name: 'RENW Skin Renewal — Gestão',
      short_name: 'RENW Gestão',
      start_url: './',
      display: 'standalone',
      background_color: '#EDE7DD',
      theme_color: '#B9AD9C',
      icons: [{ src: LOGO_B64, sizes: '260x260', type: 'image/jpeg', purpose: 'any maskable' }],
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(manifestBlob);
    document.head.appendChild(link);

    // Apple touch icon
    const touchIcon = document.createElement('link');
    touchIcon.rel = 'apple-touch-icon';
    touchIcon.href = LOGO_B64;
    document.head.appendChild(touchIcon);

    // Minimal service worker: caches this page so it opens even without a
    // network connection after the first visit (offline-first).
    if('serviceWorker' in navigator){
      const swCode = `
        const CACHE = 'rnw-erp-shell-v1';
        self.addEventListener('install', e => { self.skipWaiting(); });
        self.addEventListener('activate', e => { self.clients.claim(); });
        self.addEventListener('fetch', e => {
          if(e.request.method !== 'GET') return;
          e.respondWith(
            caches.open(CACHE).then(cache =>
              cache.match(e.request).then(cached => {
                const network = fetch(e.request).then(res => { if(res && res.ok) cache.put(e.request, res.clone()); return res; }).catch(()=>cached);
                return cached || network;
              })
            )
          );
        });
      `;
      const swBlob = new Blob([swCode], {type:'application/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
    }
  }catch(e){ /* PWA setup is a progressive enhancement; app still works fully offline via localStorage */ }
}
